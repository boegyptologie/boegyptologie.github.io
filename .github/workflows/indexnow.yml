name: Notify search engines after publication

on:
  deployment_status:
  workflow_dispatch:

permissions: {}

concurrency:
  group: boe-indexnow
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'github-pages')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify IndexNow of the published sitemap URLs
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://boegyptologie.github.io/';
          const key = 'b71b8d5e99cb4e88a9d77b78f2b82c8f';
          async function get(url) {
            const response = await fetch(url, {signal: AbortSignal.timeout(30000)});
            if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
            return response.text();
          }
          const hostedKey = (await get(`${origin}${key}.txt`)).trim();
          if (hostedKey !== key) throw new Error('Published ownership key does not match');
          const sitemap = await get(`${origin}sitemap.xml`);
          const urls = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1].replaceAll('&amp;', '&'));
          if (!urls.length || urls.length > 10000) throw new Error('Invalid sitemap URL count');
          for (const value of urls) {
            const url = new URL(value);
            if (url.origin !== new URL(origin).origin || url.hash) throw new Error('Unexpected sitemap URL');
          }
          const response = await fetch('https://api.indexnow.org/indexnow', {
            method: 'POST',
            headers: {'Content-Type': 'application/json; charset=utf-8'},
            body: JSON.stringify({host:new URL(origin).host,key,keyLocation:`${origin}${key}.txt`,urlList:urls}),
            signal: AbortSignal.timeout(30000)
          });
          if (![200,202].includes(response.status)) throw new Error(`IndexNow HTTP ${response.status}: ${await response.text()}`);
          console.log(`IndexNow accepted ${urls.length} published URLs (HTTP ${response.status}). This is receipt, not an indexing guarantee.`);
          NODE
