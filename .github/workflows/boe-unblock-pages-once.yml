name: BOE one-off Pages recovery
on:
  push:
    branches: [codex/unblock-pages-20261101]
    paths: [.github/workflows/boe-unblock-pages-once.yml]
permissions:
  actions: write
  pages: write
jobs:
  recover:
    if: github.repository == 'boegyptologie/boegyptologie.github.io' && github.ref == 'refs/heads/codex/unblock-pages-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop the identified stalled publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          """One-off recovery of the already identified BOE Pages run; no site edits."""
          import json
          import os
          import time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          REPOSITORY = 'boegyptologie/boegyptologie.github.io'
          RECOVERY_REF = 'refs/heads/codex/unblock-pages-20261101'
          RUN = 41291407832
          RELEASE = 'c061a91d6281560f7e1f396a8c440cfd10482f7e'
          OLD_DEPLOYMENT = '27c6ddb8687fe5fbc4e6b468cb344caf9325b19b'
          TERMINAL_PAGES = {'succeed', 'deployment_failed', 'deployment_content_failed',
                            'deployment_cancelled', 'deployment_lost'}
          PENDING_PAGES = {'queued', 'pending', 'in_progress', 'deployment_in_progress',
                           'deployment_pending', 'deployment_queued', 'deploying', 'waiting', 'building',
                           'deployment_attempt_error'}


          def api(method, endpoint, accepted_errors=()):
              request = Request(
                  'https://api.github.com/repos/' + REPOSITORY + endpoint,
                  data=b'' if method == 'POST' else None,
                  method=method,
                  headers={'Accept': 'application/vnd.github+json',
                           'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'X-GitHub-Api-Version': '2022-11-28',
                           'User-Agent': 'BOE-one-off-Pages-recovery'})
              try:
                  with urlopen(request, timeout=20) as response:
                      payload = response.read()
                      return response.status, json.loads(payload) if payload else {}
              except HTTPError as error:
                  if error.code in accepted_errors:
                      return error.code, {}
                  # Avoid printing request headers or any authentication data.
                  raise RuntimeError(f'GitHub rejected {method} {endpoint}: HTTP {error.code}') from None


          def main():
              if os.environ.get('GITHUB_REPOSITORY') != REPOSITORY or os.environ.get('GITHUB_REF') != RECOVERY_REF:
                  raise RuntimeError('Recovery is restricted to the designated BOE branch.')
              endpoint = f'/actions/runs/{RUN}'
              _, run = api('GET', endpoint)
              if (run.get('id') != RUN or run.get('run_number') != 650 or
                      run.get('head_sha') != RELEASE or run.get('head_branch') != 'main'):
                  raise RuntimeError('The target run does not match the reviewed release.')
              print('Target release confirmed; run status:', run.get('status'), flush=True)
              if run.get('status') == 'completed' and run.get('conclusion') == 'success':
                  print('The reviewed publication has already succeeded; no recovery required.', flush=True)
                  return

              if run.get('status') != 'completed':
                  code, _ = api('POST', endpoint + '/force-cancel', accepted_errors=(409,))
                  print('Requested cancellation of the stalled run:', code, flush=True)
                  for _ in range(40):
                      _, current = api('GET', endpoint)
                      if current.get('head_sha') != RELEASE:
                          raise RuntimeError('Target identity changed during recovery.')
                      if current.get('status') == 'completed':
                          print('Run stopped:', current.get('conclusion'), flush=True)
                          break
                      time.sleep(2)
                  else:
                      raise RuntimeError('GitHub did not stop the target run within the bounded wait.')

              pages_endpoint = '/pages/deployments/' + OLD_DEPLOYMENT
              code, deployment = api('GET', pages_endpoint, accepted_errors=(404,))
              if code == 404:
                  print('The previously reported Pages deployment is no longer found; no cancellation requested.', flush=True)
              elif deployment.get('status') in TERMINAL_PAGES:
                  print('Previous Pages deployment is terminal:', deployment['status'], flush=True)
              elif deployment.get('status') in PENDING_PAGES:
                  api('POST', pages_endpoint + '/cancel', accepted_errors=(404, 409))
                  print('Requested cancellation of the specifically identified pending Pages deployment.', flush=True)
                  for _ in range(30):
                      code, deployment = api('GET', pages_endpoint, accepted_errors=(404,))
                      if code == 404 or deployment.get('status') in TERMINAL_PAGES:
                          print('Previous Pages deployment released.', flush=True)
                          break
                      time.sleep(2)
                  else:
                      raise RuntimeError('GitHub still reports the previous Pages deployment as pending.')
              else:
                  raise RuntimeError('Unknown Pages status; no Pages cancellation requested.')
              print('Recovery checks complete. Re-run the reviewed release through the normal publication workflow.', flush=True)


          if __name__ == '__main__':
              main()
          PY

